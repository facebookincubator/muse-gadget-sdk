dependencies:
  espressif/esp_websocket_client: "~1.2"
  espressif/cjson: "~1.7"
  espressif/led_strip: "~3.0"
  # The ESP32-2432S028 (CYD) status screen.
  espressif/esp_lcd_ili9341:
    version: "~2.1"
    rules:
      - if: "target == esp32"
  espressif/esp_codec_dev:
    version: "~1.5"
    # In this order: rules stop at the first false one, and each option
    # exists only when the rule before it holds.
    rules:
      - if: "$IDF_TARGET == esp32s3"
      - if: "$CONFIG{SPIRAM} == True"
      - if: "$CONFIG{HOMEHUB_LED_BACKEND_WAVESHARE_EPD154G} == True"
      - if: "$CONFIG{HOMEHUB_VOICE} == True"
  # The Waveshare ESP32-S3-Touch-LCD-3.5 status screen. The same range as
  # components/muse, which the Waveshare P4 3.5 needs.
  espressif/esp_lcd_st7796:
    version: ">=1.5.0,<2.0.0"
    rules:
      - if: "target == esp32s3"
  idf:
    version: ">=5.1"
  # The Waveshare P4 3.5's Wi-Fi and BLE are on its ESP32-C6, over SDIO.
  espressif/esp_hosted:
    version: "~2.12.13"
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} == "waveshare_p4_lcd35"'
  espressif/esp_wifi_remote:
    version: "~1.4.2"
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} == "waveshare_p4_lcd35"'
