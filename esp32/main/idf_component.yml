dependencies:
  espressif/esp_websocket_client: "~1.2"
  espressif/cjson: "~1.7"
  espressif/led_strip: "~3.0"
  espressif/esp_codec_dev:
    version: "~1.5"
    rules:
      - if: "$IDF_TARGET == esp32s3"
      - if: "$CONFIG{SPIRAM} == True"
      - if: "$CONFIG{HOMEHUB_LED_BACKEND_WAVESHARE_EPD154G} == True && $CONFIG{HOMEHUB_VOICE} == True"
  idf:
    version: ">=5.1"
