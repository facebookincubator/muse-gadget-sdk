# Google's LC3 codec for musegadgets BLE audio. The sources are the one copy
# in xplat/liblc3, shared with the Zephyr SDK (see its README.md), or its
# fixed-point port in xplat/lc3fx with CONFIG_MUSE_GADGET_BLE_LC3_FIXED; this
# component only builds them for ESP-IDF.
description: "Google's LC3 codec (Apache-2.0), built from xplat/liblc3 or its fixed-point port xplat/lc3fx"
url: "https://github.com/google/liblc3"
license: "Apache-2.0"
