dependencies:
  # ExecuTorch runtime, only in builds with the wake word on: without it the
  # component manager neither downloads it nor puts it in dependencies.lock.
  # Pinned exact: a kernel bundle refuses any other component version,
  # including a respin of the same version.
  pytorch/executorch:
    version: "==1.6.0-dev.20261112"
    rules:
      - if: "$CONFIG{MUSE_WAKEWORD_EXECUTORCH} == \"y\""
