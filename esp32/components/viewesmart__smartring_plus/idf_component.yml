description: 'Board Support Package for Viewe SmartRing-Plus (ESP32-S3-N16R8): ST77916
  QSPI round LCD, CST816 touch, ES8311 audio, SDMMC, dual PMIC (V1 ADC / V2 AXP2101),
  and QMI8658 IMU, integrated with esp_lvgl_adapter + LVGL 9.
  
  VENDORED for muse-gadget-sdk: relaxed lvgl (>=9.4.0,<10) and esp_codec_dev (>=1.3.4,<2)
  constraints to work with Muse''s lvgl 9.5.0 and esp_codec_dev ~1.5.
  Muse does not call bsp_audio_init or bsp_power_shutdown.

  '
