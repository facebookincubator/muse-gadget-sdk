# Muse Gadget catalog model code: the XIAO advertises
# MuseGadget-XN54-XXXXXX, XXXXXX the last three bytes of its Bluetooth
# address (22 of the 25 characters the scan response leaves for the name).
CONFIG_MG_DEVICE_PRODUCT_CODE="XN54"

CONFIG_FPU=y

# Recovery and diagnostics: the reset reason for the boot log
# and the NUS console; the watchdog (WDT31, enabled in the overlay) comes
# with CONFIG_MG_WATCHDOG.
CONFIG_HWINFO=y

# Firmware updates over BLE: MCUmgr SMP (image and OS groups) beside the mg
# service, with MCUboot from sysbuild (sysbuild.conf). The image lives in
# slot0; MG_DFU confirms test images and shares slot1 with the clip queue.
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# One SMP request spans several ATT writes (reassembly) into a 512-byte
# buffer, which clients learn from the OS group's MCUmgr parameters
# (buf_size, buf_count) and fill. 512 at most: the Android app sizes
# each request to
# buf_size and writes MTU - 3 bytes at a time, and Android refuses any
# write over 512 bytes, so more fails at once on a phone at MTU 517. It
# also holds the largest response (image state, two slots: 258 bytes).
# Four buffers: Android keeps three requests in flight and Zephyr counts
# the response's buffer too. The image is written in 4 KB blocks,
# so the radio-synchronised flash driver
# (CONFIG_SOC_FLASH_NRF_RADIO_SYNC_TICKER) waits for a gap in the radio
# schedule once per 4 KB, not per request.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
# The SMP reset: the answer, the gadget drops the link itself at 100 ms
# (CONFIG_MG_DFU_RESET_DISCONNECT_MS), and restarts at 500 ms.
CONFIG_MCUMGR_GRP_OS_RESET_MS=500
CONFIG_IMG_BLOCK_BUF_SIZE=4096
# No erase of the whole image's size at an upload's first chunk: RRAM needs
# none, and img_mgmt's upfront flatten of a 320 KB image took about 38 s
# through the radio-synchronised driver before the first chunk was answered
# (measured on a XIAO from a Mac): longer than the Android app's
# 4 x 5 s for that chunk ("Upload stalled") and iOS's 30 s. Progressively,
# flash_img only blanks MCUboot's trailer (a few KB) before the first write.
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

# The boot record sits in the overlay's mg_retained block at the top
# of SRAM; the XIAO's MCUboot (swap using move) reaches about 0x200043e0
# (_image_ram_end), so this leaves room for its growth and the build checks
# the block stays above it.
CONFIG_MG_BOOT_RAM_END=0x20008000
