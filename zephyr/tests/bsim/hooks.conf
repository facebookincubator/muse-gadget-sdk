# The board hooks' build (tests/run_all.sh, gadget-homelink): the hooks'
# stand-in (tests/board_hooks.c), the board's own audio source, and SMP
# over Bluetooth behind CONFIG_MG_SMP_GATE_BOARD (no MCUboot here).
CONFIG_MG_TEST_BOARD_HOOKS=y
CONFIG_MG_AUDIO_SRC_BOARD=y
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MG_SMP_GATE_BOARD=y
