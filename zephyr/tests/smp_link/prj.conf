# MCUmgr as the XIAO builds it (boards/xiao_nrf54l15_nrf54l15_cpuapp.conf;
# run.py checks the shared lines haven't drifted), minus Bluetooth: the
# link is UDP (src/link.c) feeding the same reassembly.
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_IMG_BLOCK_BUF_SIZE=4096
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_MCUMGR_GRP_OS_RESET_MS=500
# What CONFIG_MG_DFU selects on the board.
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
CONFIG_REBOOT=y
# The XIAO's MCUboot writes 16-byte RRAM words (CONFIG_MCUBOOT_BOOT_MAX_ALIGN
# from sysbuild); the loader here uses the same (mcuboot/mcuboot_config).
CONFIG_MCUBOOT_BOOT_MAX_ALIGN=16
# img_mgmt finds the running slot from the chosen code partition (slot0).
CONFIG_USE_DT_CODE_PARTITION=y
# RRAM: no erase before a write (as tests/unit's rram and slot1 builds).
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_EXPLICIT_ERASE=n
CONFIG_FLASH_SIMULATOR_UNALIGNED_READ=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y

# The UDP link: host sockets (native simulator offloaded sockets).
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_ETH_NATIVE_TAP=n

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MG_LOG_LEVEL_INF=y
CONFIG_IMG_MANAGER_LOG_LEVEL_INF=y
CONFIG_MCUMGR_GRP_IMG_LOG_LEVEL_INF=y

# SMP's memory from the C library's arena (all free RAM on the XIAO).
# Zephyr's own malloc (sys_heap over a fixed arena) as on the board, not the
# host's: native_sim links the host C library by default, whose malloc never
# runs out, and an arena that can't run out proves nothing about sharing it.
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
# Asserts on: Zephyr's own checks on the buffers the smp.c copy makes.
CONFIG_ASSERT=y

# Room after the transport's user data for each request's source connection
# (src/zephyr/smp.c, change 3).
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=16
