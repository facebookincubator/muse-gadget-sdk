# Lab and CI builds: the automation tools (CONFIG_MG_AUTOMATION, off in
# release builds); the bench console is in every build.
# -DEXTRA_CONF_FILE=overlay-bench.conf.
CONFIG_MG_AUTOMATION=y
CONFIG_MG_BENCH=y
CONFIG_CONSOLE_GETCHAR=y
# Bench builds offer gadget- at a new setup (off by default:
# CONFIG_MG_NODE_ID_GADGET).
CONFIG_MG_NODE_ID_GADGET=y
# Bench mode: every human step scriptable; the image id marks it
# (cmake/mg_image_id.cmake) and it never ships.
CONFIG_MG_BENCH_MODE=y
