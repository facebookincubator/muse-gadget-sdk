# A release build: what leaves the bench (a page, a published image, a
# user's unit). The automation tools are off (CONFIG_MG_AUTOMATION, the
# default here; this file says so for a board or conf that turns it on), so
# the Nordic UART's state-changing words need the token proof, the bench
# switch takes the proof only and refuses a set-up gadget, the recovery
# bench rows are refused, setup confirms only on the real button, start_mic
# needs a press, and an unproven central's Bluetooth update write is
# answered 10 with the update prompt (one press, bound to the upload). Bench
# mode is off too: overlay-bench-mode.conf after it turns it back on, and
# that image is marked .bench. check_mic_gate.py --release runs after the
# link. Its image id and firmware string carry no .auto or .bench
# (cmake/mg_image_id.cmake). Pass it last: a conf file after it, or
# -DCONFIG_MG_AUTOMATION=y, turns automation back on (the last value wins):
#   -DEXTRA_CONF_FILE="<the token conf>;overlay-release.conf"
CONFIG_MG_AUTOMATION=n
CONFIG_MG_BENCH_MODE=n
