# The XIAO nRF54L15 boots through MCUboot (build with --sysbuild). Swap using
# move keeps test, confirm and revert: a new image runs on test, the app
# confirms it once BLE is up, and an image that never gets there is swapped
# back at the next reset. Images are signed with ECDSA P-256. Production
# builds set SB_CONFIG_BOOT_SIGNATURE_KEY_FILE to their own private key (kept
# out of the repository); MCUboot's development key
# (bootloader/mcuboot/root-ec-p256.pem, the default) is public, so a build
# with it fails unless it adds sysbuild-dev.conf (a bench or development
# unit; sysbuild.cmake).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
