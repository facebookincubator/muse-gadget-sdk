name: macOS companion
on:
  pull_request:
    paths: ['macos/**', 'linux/**', '.github/workflows/macos.yml']
  push:
    branches: [main]
    paths: ['macos/**', 'linux/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: swift test --disable-xctest
      - run: bash build.sh
      - run: .runtime/bin/python3 -m pip install pytest
      - run: PYTHONPATH=../linux/src .runtime/bin/python3 -m pytest -q ../linux/tests Backend
      - run: codesign --verify --deep --strict --verbose "dist/Muse Companion.app"
