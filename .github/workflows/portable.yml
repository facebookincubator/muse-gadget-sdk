name: Portable libraries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (${{ matrix.library }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        library: [mg_device_session, mg_link_setup, mg_rng]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      # The Link setup end-to-end tests drive the gadget with a phone written
      # in Python on `cryptography`. The PSA backend legs run only where
      # `pkg-config mbedcrypto` finds mbedTLS, so they skip here.
      - name: Install
        run: python -m pip install cryptography

      # Each suite builds with plain cc: a strict -Werror build, the
      # exported-symbol prefix check, and its tests at -O2 and under
      # ASan + UBSan.
      - name: Run tests
        env:
          LIBRARY: ${{ matrix.library }}
        run: bash "portable/$LIBRARY/tests/run.sh"
