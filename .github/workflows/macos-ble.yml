name: Mac BLE pairing

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Build and verify native helper
        run: |
          sh docker-mac/build-helper.sh
          codesign --verify --strict docker-mac/build/MuseBluetooth.app
      - name: Install Python SDK and test dependencies
        run: python -m pip install --only-binary=cryptography pytest ./linux
      - name: Test packet transport and credential handoff
        env:
          PYTHONPATH: linux/src:docker-mac
        run: python -m pytest -q docker-mac/test_mac_ble.py docker-mac/test_pair_mac.py docker-mac/test_pair_board.py linux/tests/test_stdio_ble.py

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell scripts and Compose
        run: |
          shellcheck docker-mac/*.sh docker-mac/start.command
          shellcheck docker-mac/board-sim/*.sh
          docker compose config --quiet
          docker compose -f docker-mac/board-sim/compose.yaml config --quiet
          docker compose -f docker-mac/board-sim/compose.yaml -f docker-mac/board-sim/compose-ai.yaml config --quiet
