name: Linux client

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: newest
            python: "3.x"
            pins: ""
          # The oldest versions the package supports (Debian 11).
          - name: oldest
            python: "3.9"
            pins: "cryptography==3.3.2 websockets==13.1"
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        env:
          PINS: ${{ matrix.pins }}
        run: python -m pip install pytest . $PINS

      - name: Run tests
        run: python -m pytest -q

  shellcheck:
    name: ShellCheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck linux/install.sh
