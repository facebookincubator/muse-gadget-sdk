name: ESP32 firmware

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PRs cancel superseded runs; main queues them so a web flasher deploy
# always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Run on the host before ESP-IDF pulls its large container image.
      - name: Free disk space (preinstalled Android SDK, ~12 GB)
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h /

      # ThreadSanitizer stops at start ("unexpected memory mapping") under the
      # runner's default address-space randomization, and the container refuses
      # setarch -R, so every TSan test would skip (tests/tsan_run.py). The
      # container shares the runner's kernel: 28 bits is what it expects.
      - name: Let ThreadSanitizer run (vm.mmap_rnd_bits=28)
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # Exercise the actual FreeInk router without a board or Arduino runtime.
      - name: Check out pinned FreeInk host-test source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Free-Ink/freeink-sdk
          ref: 2c047df7792cedece1191503793f18f5d8f1c695
          path: freeink-host-source
          persist-credentials: false

      - name: Run host tests in ESP-IDF
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        env:
          FREEINK_SOURCE_DIR: ../freeink-host-source
        with:
          esp_idf_version: v6.0.3
          target: esp32c5
          path: esp32
          extra_docker_args: -e FREEINK_SOURCE_DIR
          command: |
            set -e
            # test_noise_core links against the host PSA Crypto library;
            # test_web_flasher runs the web flasher logic in Node.
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends libmbedtls-dev libjpeg-dev pkg-config libssl-dev openssl ffmpeg nodejs procps lsof
            . "$IDF_PATH/export.sh" > /dev/null
            # Fetch cJSON from managed_components/ for discovery and pairing.
            idf.py -B build-host-tests -DSDKCONFIG=build-host-tests/sdkconfig reconfigure
            # The mirror tests decode its messages with numpy (tools/muse/requirements-mirror.txt).
            python -m pip install -q "numpy>=1.26"
            # Registry components for the wake word runner tests (ExecuTorch,
            # esp-nn, the microfrontend). No apostrophes in this command: the
            # action wraps it in single quotes.
            # The action exports IDF_TARGET=esp32c5: override it for this one.
            IDF_TARGET=esp32s3 idf.py -B build-host-wakeword -DSDKCONFIG=build-host-wakeword/sdkconfig \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;devices/sdkconfig.muse;devices/sdkconfig.muse-sensecap-watcher;devices/sdkconfig.muse-wakeword" \
              reconfigure
            # One process per test module under the freeze watchdog: a module that hangs is stopped and
            # reported as STUCK instead of holding the job until its timeout.
            # A 900 s cap until a module has a typical time (CI keeps none), so a hang ends well inside the job timeout.
            python tools/stuck_watch.py --cap 900 -- python -m unittest discover -s tests -p "test_*.py" -v
            cmake -S tests/avatar_webp -B build-host-avatar-webp -G Ninja
            cmake --build build-host-avatar-webp --parallel 2
            ctest --test-dir build-host-avatar-webp --output-on-failure

  simulator:
    name: UI simulator (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            sanitizers: "ON"
          - name: macOS (Apple silicon)
            os: macos-latest
            sanitizers: "OFF"
          - name: macOS (Intel)
            os: macos-15-intel
            sanitizers: "OFF"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        run: |
          cmake -S esp32/simulator -B build/simulator -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMUSE_SIM_SANITIZERS=${{ matrix.sanitizers }} \
            -DMUSE_SIM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/simulator --parallel

      - name: Test
        run: ctest --test-dir build/simulator --output-on-failure

      # The Muse Gadgets test apps' protocol code (capabilities, the token proof), on the
      # desktop JVM and as a macOS executable: the runner has the Android SDK, a JDK and Swift.
      - name: Test app host tests
        if: matrix.name == 'macOS (Apple silicon)'
        run: |
          android/musegadgetstest/tests/run.sh
          ios/musegadgetstest/tests/run.sh

  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    # Healthy builds take 5-8 minutes; a stalled ESP-IDF image pull fails
    # here instead of after GitHub's six-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: devkit
            target: esp32c5
            overlays: ""
          - board: echoear-2st
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-ostb-echoear-2st"
          - board: c6-nopsram
            target: esp32c6
            overlays: ";devices/sdkconfig.c6-nopsram"
          - board: waveshare-c6-lcd-147
            target: esp32c6
            overlays: ";devices/sdkconfig.waveshare-c6-lcd-147"
          - board: c3-oled-042
            target: esp32c3
            overlays: ";devices/sdkconfig.c3-oled-042"
          - board: m5stack-corematrix
            target: esp32c61
            overlays: ";devices/sdkconfig.m5stack-corematrix"
          - board: ideaspark
            target: esp32
            overlays: ";devices/sdkconfig.ideaspark"
          - board: esp32-2432s028
            target: esp32
            overlays: ";devices/sdkconfig.esp32-2432s028"
          - board: sensecap-indicator
            target: esp32s3
            overlays: ";devices/sdkconfig.sensecap-indicator"
          - board: reterminal-e1001
            target: esp32s3
            overlays: ";devices/sdkconfig.reterminal-e1001"
          - board: reterminal-e1002
            target: esp32s3
            overlays: ";devices/sdkconfig.reterminal-e1002"
          - board: reterminal-e1003
            target: esp32s3
            overlays: ";devices/sdkconfig.reterminal-e1003"
          - board: reterminal-sticky
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.reterminal-sticky"
          - board: reterminal-sticky-power-test
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.reterminal-sticky;devices/sdkconfig.reterminal-sticky-power-test"
          - board: reterminal-sticky-link
            target: esp32s3
            overlays: ";devices/sdkconfig.reterminal-sticky-link"
          - board: waveshare-s3-epaper-154
            target: esp32s3
            overlays: ";devices/sdkconfig.waveshare-s3-epaper-154"
          - board: waveshare-s3-epaper-154g
            target: esp32s3
            overlays: ";devices/sdkconfig.waveshare-s3-epaper-154g"
          - board: waveshare-s3-lcd-35
            target: esp32s3
            overlays: ";devices/sdkconfig.waveshare-s3-lcd-35"
          - board: home-assistant-voice
            target: esp32s3
            overlays: ";devices/sdkconfig.home-assistant-voice"
          - board: espressif-s3-devkitc-1
            target: esp32s3
            overlays: ";devices/sdkconfig.espressif-s3-devkitc-1"
          - board: seeed-respeaker-lite
            target: esp32s3
            overlays: ";devices/sdkconfig.seeed-respeaker-lite"
          - board: seeed-respeaker-xvf3800
            target: esp32s3
            overlays: ";devices/sdkconfig.seeed-respeaker-xvf3800"
          - board: muse-waveshare-s3-175c
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c"
          # The board's Muse Gadget profile (tools/muse/board.sh build s3-gadget).
          - board: muse-waveshare-s3-175c-gadget
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-waveshare-s3-175c-gadget"
          # The same gadget without firmware updates over BLE (SMP off, as the ESP-Mosaico's default).
          - board: muse-waveshare-s3-175c-gadget-nosmp
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-waveshare-s3-175c-gadget;devices/sdkconfig.muse-gadget-nosmp"
          # Lab and CI images: a BLE gadget profile with the bench overlay (MUSE_BENCH=1).
          - board: muse-waveshare-s3-175c-bench
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-waveshare-s3-175c-gadget;devices/sdkconfig.muse-bench"
          - board: muse-waveshare-s3-175
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175"
          - board: muse-waveshare-s3-175c-theme
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-ui-theme"
          # Video from a phone (MUSE_VIDEO=1 tools/muse/board.sh): the decoder and Wi-Fi transport.
          - board: muse-waveshare-s3-175c-video
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-video"
          - board: muse-waveshare-s3-175c-avatar
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-avatar-sync"
          - board: muse-waveshare-s3-175c-avatar-motion
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-avatar-sync;devices/sdkconfig.muse-avatar-animations"
          - board: muse-waveshare-s3-185b
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-185b"
          - board: muse-waveshare-s3-185c
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-185c"
          - board: muse-waveshare-s3-143
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-143"
          - board: muse-lilygo-s3-amoled-175
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-lilygo-s3-amoled-175"
          - board: muse-waveshare-s3-146
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-146"
          - board: muse-waveshare-s3-lcd7
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-lcd7"
          - board: muse-waveshare-s3-lcd128
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-lcd128"
          - board: muse-waveshare-s3-lcd349
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-lcd349"
          - board: muse-spotpear-esp32-ai-128
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-spotpear-esp32-ai-128"
          - board: muse-waveshare-s3-216
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-216"
          - board: muse-waveshare-s3-206
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-206"
          - board: muse-waveshare-s3-143c
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-143c"
          - board: muse-waveshare-p4-lcd35
            target: esp32p4
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-p4-lcd35"
          - board: muse-waveshare-p4-lcd35-camera
            target: esp32p4
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-p4-lcd35;devices/sdkconfig.muse-waveshare-p4-lcd35-camera"
          - board: muse-aipi-voice-note-toggle
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-aipi;devices/sdkconfig.muse-voice-note-toggle"
          - board: muse-aipi
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-aipi"
          - board: muse-atk-dnesp32s3-box
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-atk-dnesp32s3-box"
          - board: muse-atk-dnesp32s3-box2
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-atk-dnesp32s3-box2"
          - board: muse-waveshare-c6-18
            target: esp32c6
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-c6-18"
          # The C6's BLE-only gadget (tools/muse/board.sh build c6ble).
          - board: muse-waveshare-c6-18-ble
            target: esp32c6
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-c6-18;devices/sdkconfig.muse-waveshare-c6-18-ble"
          - board: muse-waveshare-s3-18
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-18"
          - board: muse-waveshare-c6-206
            target: esp32c6
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-c6-206"
          - board: muse-sensecap-watcher
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-sensecap-watcher"
          # The board's Muse Gadget profile (tools/muse/board.sh build watcher-gadget).
          - board: muse-sensecap-watcher-gadget
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-sensecap-watcher;devices/sdkconfig.muse-sensecap-watcher-gadget"
          - board: muse-watcher-power-test
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-sensecap-watcher;devices/sdkconfig.muse-watcher-power-test"
          # The opt-in "Hey Muse" wake word (not on the web flasher).
          - board: muse-sensecap-watcher-wakeword
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-sensecap-watcher;devices/sdkconfig.muse-wakeword"
          - board: muse-waveshare-s3-175c-power-test
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-waveshare-s3-175c-power-test"
          - board: muse-waveshare-s3-216-power-test
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-216;devices/sdkconfig.muse-waveshare-s3-216-power-test"
          - board: muse-aipi-power-test
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-aipi;devices/sdkconfig.muse-aipi-power-test"
          - board: muse-m5stack-cardputer-adv
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-cardputer-adv"
          - board: muse-m5stack-atoms3
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-atoms3"
          - board: muse-espressif-box-3
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-espressif-box-3"
          - board: muse-m5stack-sticks3
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-sticks3"
          - board: muse-crowpanel-advance-43
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-crowpanel-advance-43"
          - board: muse-m5stack-stopwatch
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-stopwatch"
          - board: muse-m5stack-stopwatch-video
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-stopwatch;devices/sdkconfig.muse-video"
          # Video and UI streams over BLE (tools/muse/board.sh build stopwatch-video / watcher-video),
          # HID beside them (MUSE_HID=1), and a BLE gadget without the offline clip queue.
          - board: muse-m5stack-stopwatch-video-ble
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-stopwatch;devices/sdkconfig.muse-video-ble;devices/sdkconfig.muse-m5stack-stopwatch-video-ble"
          - board: muse-sensecap-watcher-video-ble
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-sensecap-watcher;devices/sdkconfig.muse-sensecap-watcher-gadget;devices/sdkconfig.muse-video-ble;devices/sdkconfig.muse-sensecap-watcher-video-ble"
          - board: muse-m5stack-stopwatch-video-ble-hid
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-stopwatch;devices/sdkconfig.muse-video-ble;devices/sdkconfig.muse-m5stack-stopwatch-video-ble;devices/sdkconfig.muse-hid"
          - board: muse-waveshare-s3-175c-no-queue
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-waveshare-s3-175c-gadget;devices/sdkconfig.muse-ble-no-queue"
          - board: muse-m5stack-triviapod
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-triviapod"
          - board: muse-m5stack-stopwatch-apps
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-stopwatch;devices/sdkconfig.muse-apps"
          - board: muse-seeed-xiao-s3-147
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-seeed-xiao-s3-147"
          - board: muse-m5stack-cores3
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-cores3"
          - board: muse-m5stack-cores3lite
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-cores3lite"
          - board: muse-guition-jc3248w535
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-guition-jc3248w535"
          - board: muse-m5stack-stickc-plus2
            target: esp32
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-stickc-plus2"
          - board: muse-m5stack-core2
            target: esp32
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-core2"
          - board: muse-fnk0104b
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-fnk0104b"
          - board: muse-vn-s3-183
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-vn-s3-183"
          - board: muse-ai-passport
            target: esp32c3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-ai-passport"
          - board: muse-deotaland-rorolee
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-deotaland-rorolee"
          - board: muse-viewe-smartring-plus
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-viewe-smartring-plus"
          - board: muse-waveshare-s3-lcd19
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-lcd19"
          - board: muse-waveshare-s3-lcd-35
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-lcd-35"
          - board: muse-dfrobot-unihiker-k10
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-dfrobot-unihiker-k10"
    defaults:
      run:
        shell: bash
        working-directory: esp32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Run on the host before ESP-IDF pulls its large container image.
      - name: Free disk space (preinstalled Android SDK, ~12 GB)
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h /

      # The build fails if the app no longer fits its partition.
      - name: Build
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        env:
          TARGET: ${{ matrix.target }}
          DEFAULTS: sdkconfig.defaults${{ matrix.overlays }}
        with:
          esp_idf_version: v6.0.3
          target: ${{ matrix.target }}
          path: esp32
          extra_docker_args: -e TARGET -e DEFAULTS
          command: |
            set -e
            . "$IDF_PATH/export.sh" > /dev/null
            idf.py -B build -DIDF_TARGET="$TARGET" -DSDKCONFIG=build/sdkconfig \
              -DSDKCONFIG_DEFAULTS="$DEFAULTS" build

      # Boards listed in web-flasher/boards.json also go on the web flasher.
      - name: Package for the web flasher
        id: package
        env:
          BOARD: ${{ matrix.board }}
        run: |
          NAME=$(python3 -c 'import json, os; print(next((b["name"] for b in json.load(open("../web-flasher/boards.json")) if b["board"] == os.environ["BOARD"]), ""))')
          [ -n "$NAME" ] || exit 0
          # The manifest's version is the image's own, what the gadget reports.
          python3 ../web-flasher/make_manifest.py build "out/$BOARD" "Muse Gadget ($NAME)"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      - if: steps.package.outputs.listed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: esp32/out/
          if-no-files-found: error
          retention-days: 7

  # The web flasher: a page on GitHub Pages that flashes the boards in
  # web-flasher/boards.json from Chrome or Edge over Web Serial (ESP Web Tools).
  # PRs assemble it to check it; pushes to main deploy it.
  web-flasher:
    name: Assemble web flasher
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: site/firmware
          merge-multiple: true

      # A listed board that the build matrix doesn't build has no manifest.
      - name: Add page
        run: |
          for board in $(jq -r '.[].board' web-flasher/boards.json); do
            [ -f "site/firmware/$board/manifest.json" ] || {
              echo "::error::$board is in web-flasher/boards.json but not in the build matrix"
              exit 1
            }
          done
          cp web-flasher/index.html web-flasher/*.js web-flasher/boards.json site/
          echo "{\"commit\": \"$GITHUB_SHA\"}" > site/build.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-web-flasher:
    name: Deploy web flasher
    needs: web-flasher
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
