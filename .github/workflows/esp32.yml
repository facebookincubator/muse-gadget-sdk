            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-175c;devices/sdkconfig.muse-waveshare-s3-175c-gadget;devices/sdkconfig.muse-ble-no-queue"
          - board: muse-m5stack-triviapod
