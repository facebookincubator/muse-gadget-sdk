          - board: muse-m5stack-core2
            target: esp32
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-core2"
          - board: muse-fnk0104b
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-fnk0104b"
          - board: muse-vn-s3-183
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-vn-s3-183"
          - board: muse-ai-passport
            target: esp32c3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-ai-passport"
          - board: muse-deotaland-rorolee
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-deotaland-rorolee"
          - board: muse-viewe-smartring-plus
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-viewe-smartring-plus"
          - board: muse-waveshare-s3-lcd19
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-lcd19"
          - board: muse-waveshare-s3-lcd-35
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-waveshare-s3-lcd-35"
          - board: muse-dfrobot-unihiker-k10
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-dfrobot-unihiker-k10"
          - board: muse-m5stack-stackchan
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-stackchan"
          BOARDS
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          targets=$(jq -r '[.include[].boards[].target] | unique | join(",")' /tmp/matrix.json)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "\(.group): \(.names)"' /tmp/matrix.json

  # Each job builds its group's boards in turn on one ESP-IDF setup: a native
  # install of the release (the image's version and tools), restored from the
  # Actions cache, so no job pulls the multi-GB image. ccache keeps each group's
  # objects from the last push to main.
  build:
    name: Build ${{ matrix.group }} (${{ matrix.names }})
    needs: plan
    runs-on: ubuntu-latest
    # A cold build takes about 4 minutes a board. Each board's build has its
    # own limit (BUILD_TIMEOUT_S), and the job's covers three of them plus setup.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: esp32
    env:
      IDF_PATH: /home/runner/esp-idf
      IDF_TOOLS_PATH: /home/runner/.espressif
      IDF_CCACHE_ENABLE: "1"
      # No CCACHE_BASEDIR: it would make the project's paths relative, and
      # ESP-IDF's -fmacro-prefix-map would no longer apply to __FILE__. The
      # runner's paths are fixed, so the cache hits anyway.
      CCACHE_DIR: /home/runner/.ccache
      # Each push to main saves 26 of these (about 150 MB each) and one
      # ESP-IDF install (about 2 GB). Over the repository's cache limit GitHub
      # evicts the least recently used entries first; every build job restores
      # the ESP-IDF install, so older pushes' ccache entries go before it.
      CCACHE_MAXSIZE: 250M
      BUILD_TIMEOUT_S: "900"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          # ESP-IDF's Linux prerequisites that the runner image may not have.
          timeout 300 sudo apt-get update -qq
          timeout 300 sudo apt-get install -y -qq --no-install-recommends ccache flex bison gperf ninja-build > /dev/null

      - name: Cache keys
        id: keys
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          py=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          targets=$TARGETS   # a cache key can't hold commas
          echo "idf=esp-idf-$IDF_VERSION-${IDF_COMMIT::12}-${{ runner.os }}-${{ runner.arch }}-$ImageOS-py$py-${targets//,/-}-${{ hashFiles('.github/esp32/setup_idf.sh') }}" >> "$GITHUB_OUTPUT"
          echo "ccache=ccache-esp32-$IDF_VERSION-${{ matrix.group }}" >> "$GITHUB_OUTPUT"

      - name: Restore ESP-IDF
        id: idf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/esp-idf
            /home/runner/.espressif
          key: ${{ steps.keys.outputs.idf }}

      - name: Set up ESP-IDF
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: ../.github/esp32/setup_idf.sh "$IDF_VERSION" "$IDF_COMMIT" "$TARGETS"

      # Only pushes to main save the install, as with ccache below, and only
      # one group's job (they all install the same).
      - name: Save ESP-IDF
        if: github.event_name == 'push' && matrix.group == 'g01' && steps.idf.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/esp-idf
            /home/runner/.espressif
          key: ${{ steps.keys.outputs.idf }}

      # Pull requests start from main's objects. A push to main builds from
      # scratch, so the firmware main publishes never reuses an earlier build's
      # objects; it saves them for the pull requests after it.
      - name: Restore ccache
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.sha }}
          restore-keys: ${{ steps.keys.outputs.ccache }}-

      # The build fails if the app no longer fits its partition.
      - name: Build
        env:
          BOARDS: ${{ toJSON(matrix.boards) }}
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          ccache -z > /dev/null
          ../.github/esp32/build_group.sh

      - name: Save ccache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.sha }}

      # Boards listed in web-flasher/boards.json also go on the web flasher.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.group }}
          path: esp32/out/
          if-no-files-found: ignore
          retention-days: 7

  # The web flasher: a page on GitHub Pages that flashes the boards in
  # web-flasher/boards.json from Chrome or Edge over Web Serial (ESP Web Tools).
  # PRs assemble it to check it; pushes to main deploy it.
  web-flasher:
    name: Assemble web flasher
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: site/firmware
          merge-multiple: true

      # A listed board that the build matrix doesn't build has no manifest.
      - name: Add page
        run: |
          for board in $(jq -r '.[].board' web-flasher/boards.json); do
            [ -f "site/firmware/$board/manifest.json" ] || {
              echo "::error::$board is in web-flasher/boards.json but not in the build matrix"
              exit 1
            }
          done
          cp web-flasher/index.html web-flasher/*.js web-flasher/boards.json site/
          echo "{\"commit\": \"$GITHUB_SHA\"}" > site/build.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-web-flasher:
    name: Deploy web flasher
    needs: web-flasher
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
