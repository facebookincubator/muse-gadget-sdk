name: lc3-kotlin

on:
  pull_request:
    paths:
      - "android/lc3-kotlin/**"
      - ".github/workflows/lc3-kotlin.yml"
  push:
    branches: [main]
    paths:
      - "android/lc3-kotlin/**"
      - ".github/workflows/lc3-kotlin.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance with liblc3
    # The runner image's JDK 17; the wrapper checks the Gradle download's SHA-256.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android/lc3-kotlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon test
