[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "musegadget"
version = "0.1.0"
description = "Make any Linux computer into a Muse Home Link that pairs with the Muse app"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
# cryptography comes from the distro (python3-cryptography) on devices; the
# floor is Debian 11 / Raspberry Pi OS Bullseye's 3.3.2.
dependencies = ["cryptography>=3.3.2", "websockets>=13"]

[project.scripts]
musegadget = "musegadget.cli:main"

[project.optional-dependencies]
test = ["pytest"]
voice = ["sounddevice>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musegadget = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
