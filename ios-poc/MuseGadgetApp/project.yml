# Generate the Xcode project with `xcodegen` (brew install xcodegen).
name: MuseGadget
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  MuseGadgetKit:
    path: ../MuseGadgetKit
targets:
  MuseGadget:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MuseGadgetKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Muse Gadget
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Muse Gadget advertises over Bluetooth so the Muse app on another phone can pair with it.
        # Keeps the GATT server serving while briefly backgrounded. Advertising
        # in the background drops the name, so pair with the app open.
        UIBackgroundModes: [bluetooth-peripheral]
    # Bundle ID and signing team: Config.xcconfig, overridden by your own
    # Local.xcconfig next to it.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
